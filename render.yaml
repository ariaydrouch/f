services:
  - type: web
    name: finn
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/meta
    envVars:
      - key: FINN_LLM_API_KEY
        sync: false
      - key: FINN_LLM_BASE_URL
        sync: false
      - key: FINN_LLM_CHEAP_MODEL
        sync: false
      - key: FINN_LLM_STRONG_MODEL
        sync: false
